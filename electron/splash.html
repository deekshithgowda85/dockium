<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOCKIUM Loading</title>
    <style>
      :root {
        --bg: #ffffff;
        --text: #121826;
        --muted: #6a7488;
        --ring: #e5e9f1;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        color: var(--text);
        font-family: "Segoe UI", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
        background: var(--bg);
      }

      .shell {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        padding: 20px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 18px 22px;
        border: 1px solid var(--ring);
        border-radius: 999px;
      }

      .logo {
        width: 38px;
        height: 38px;
        flex: 0 0 38px;
      }

      .logo svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .brand h1 {
        margin: 0;
        font-size: 30px;
        line-height: 1;
        letter-spacing: 0.08em;
        font-weight: 600;
        text-transform: uppercase;
      }

      .brand .wordmark {
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.13em;
        margin-top: 3px;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="brand">
        <svg class="logo" width="38" height="38" viewBox="0 0 44.169 45.988" fill="#1f2937" xmlns="http://www.w3.org/2000/svg" aria-label="Dockium logo" role="img">
          <path d="M 21.955078 0 A 1.029 1.029 0 0 0 21.292969 0.28125 A 11.988 11.988 0 0 0 18 7.9882812 A 11.982 11.982 0 0 0 21.292969 15.699219 L 22.169922 16.578125 L 23.5 17.900391 L 28.585938 22.986328 L 23.5 28.074219 L 24.292969 28.867188 A 13.886 13.886 0 0 1 28.171875 37.988281 A 11.481 11.481 0 0 1 27.880859 40.521484 L 43.292969 25.109375 A 3 3 0 0 0 43.292969 20.867188 L 22.705078 0.28125 A 1.029 1.029 0 0 0 21.955078 0 z M 16.289062 5.4550781 L 0.87695312 20.867188 A 3 3 0 0 0 0.87695312 25.109375 L 21.462891 45.699219 A 1 1 0 0 0 22.876953 45.699219 A 11.982 11.982 0 0 0 26.169922 37.992188 A 11.988 11.988 0 0 0 22.876953 30.285156 L 15.583984 22.988281 L 20.669922 17.900391 L 19.876953 17.107422 A 13.877 13.877 0 0 1 16 7.9882812 A 11.478 11.478 0 0 1 16.289062 5.4550781 z" />
        </svg>
        <div>
          <h1>DOCKIUM</h1>
          <div class="wordmark">SECURITY WORKBENCH</div>
        </div>
      </div>
    </div>
  </body>
</html>
