<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOCKIUM Loading</title>
    <style>
      :root {
        --bg: #edf2f9;
        --panel: #ffffff;
        --line: #d7dfea;
        --text: #1f2937;
        --muted: #5b6677;
        --accent: #2e6be6;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: radial-gradient(circle at 20% 15%, #f7fbff 0%, #edf2f9 46%, #e4eaf4 100%);
        font-family: "Segoe UI", Arial, sans-serif;
        color: var(--text);
      }

      .shell {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
      }

      .panel {
        width: 440px;
        max-width: calc(100vw - 24px);
        border: 1px solid var(--line);
        background: var(--panel);
        box-shadow: 0 20px 42px rgba(37, 63, 111, 0.16);
        padding: 24px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .logo {
        width: 84px;
        height: 84px;
        display: block;
        flex: 0 0 84px;
      }

      .logo svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .brand h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0.05em;
      }

      .brand p {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      .progress {
        margin-top: 18px;
        height: 6px;
        border: 1px solid var(--line);
        background: #edf2f9;
        overflow: hidden;
      }

      .progress > b {
        display: block;
        height: 100%;
        width: 38%;
        background: linear-gradient(90deg, #2e6be6, #6ca0ff);
        animation: loading 1.1s ease-in-out infinite alternate;
      }

      .status {
        margin-top: 10px;
        font-size: 12px;
        color: var(--muted);
      }

      @keyframes loading {
        from {
          transform: translateX(-36%);
        }
        to {
          transform: translateX(168%);
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="panel">
        <div class="brand">
          <svg class="logo" width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Dockium logo" role="img">
            <rect x="18" y="18" width="28" height="28" rx="8" stroke="#1F2937" stroke-width="2"/>
            <rect x="23" y="23" width="5" height="5" fill="#60A5FA"/>
            <rect x="30" y="23" width="5" height="5" fill="#60A5FA"/>
            <rect x="23" y="30" width="5" height="5" fill="#60A5FA"/>
            <path d="M28 36L32 40L40 32" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <div>
            <h1>DOCKIUM</h1>
            <p>Initializing security workbench...</p>
          </div>
        </div>
        <div class="progress"><b></b></div>
        <div class="status">Loading UI runtime, IPC bridge, and workspace modules</div>
      </div>
    </div>
  </body>
</html>
