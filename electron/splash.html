<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOCKIUM Loading</title>
    <style>
      :root {
        --bg: #0b0f14;
        --card: #121821;
        --border: #1f2a37;
        --accent: #4a7cff;
        --text: #e6edf3;
        --muted: #8b949e;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        color: var(--text);
        font-family: "Inter", "SF Pro Text", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
        background: var(--bg);
      }

      .shell {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        padding: 18px;
      }

      .panel {
        width: 496px;
        max-width: calc(100vw - 36px);
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--card);
        box-shadow: 0 14px 32px rgba(0, 0, 0, 0.38);
        padding: 24px 26px 20px 24px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .logo {
        width: 44px;
        height: 44px;
        flex: 0 0 44px;
      }

      .logo svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .brand h1 {
        margin: 0;
        font-size: 29px;
        line-height: 1.08;
        letter-spacing: 0.045em;
        font-weight: 560;
        text-transform: uppercase;
      }

      .brand p {
        margin: 7px 0 0;
        color: var(--muted);
        font-size: 16px;
        font-weight: 400;
      }

      .progress {
        margin-top: 18px;
        height: 3px;
        border-radius: 999px;
        background: #1a2533;
        overflow: hidden;
      }

      .progress > b {
        display: block;
        height: 100%;
        width: 34%;
        border-radius: 999px;
        background: var(--accent);
        animation: progress-move 1.5s ease-in-out infinite;
      }

      .status {
        margin-top: 12px;
        font-size: 13px;
        color: var(--muted);
        line-height: 1.35;
      }

      @keyframes progress-move {
        from {
          transform: translateX(-38%);
        }
        to {
          transform: translateX(216%);
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="panel">
        <div class="brand">
          <svg class="logo" width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Dockium logo" role="img">
            <rect x="6" y="7" width="20" height="18" rx="3" stroke="#8B949E" stroke-width="1.8" />
            <path d="M10 11H14" stroke="#8B949E" stroke-width="1.6" stroke-linecap="round" />
            <path d="M18 11H22" stroke="#8B949E" stroke-width="1.6" stroke-linecap="round" />
            <path d="M10 15H14" stroke="#8B949E" stroke-width="1.6" stroke-linecap="round" />
            <path d="M25 17.5C25 13.1 21.7 10.5 18 10.5C14.3 10.5 11 13.1 11 17.5C11 24 18 28.5 18 28.5C18 28.5 25 24 25 17.5Z" stroke="#4A7CFF" stroke-width="1.8" />
            <path d="M14.8 17.8L17.4 20.2L21.6 15.7" stroke="#4A7CFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <div>
            <h1>DOCKIUM</h1>
            <p>Initializing security workbench...</p>
          </div>
        </div>
        <div class="progress"><b></b></div>
        <div class="status">Loading UI runtime, IPC bridge, and workspace modules</div>
      </div>
    </div>
  </body>
</html>
